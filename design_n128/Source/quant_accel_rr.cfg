# ─────────────────────────────────────────────────────────────────────────────
# quant_accel.cfg — v++ link configuration (Option B)
#
# Adds decision_sink, moves the two DMA endpoints (upd_inject, decision_sink)
# onto HBM, and wires the three app result streams into the sink. stream_connect
# is strictly point-to-point, which is why sv_bcast3/sv_bcast2 exist.
# ─────────────────────────────────────────────────────────────────────────────
platform=/opt/xilinx/platforms/xilinx_u50_gen3x16_xdma_5_202210_1/xilinx_u50_gen3x16_xdma_5_202210_1.xpfm

[connectivity]
nk=upd_inject:1:upd_inject
nk=lob_filter:1:lob_filter
nk=inctsvd_top:1:inctsvd_top
nk=sv_bcast3:1:bcast_st
nk=sv_bcast2:1:bcast_pm
nk=momentum_signal:1:momentum_signal
nk=risk_matrix:1:risk_matrix
nk=regime_classifier:1:regime_classifier
nk=decision_sink:1:decision_sink

# ── DMA endpoints -> HBM ─────────────────────────────────────────────────────
# NEW in B: Option A used no HBM at all. The feeder reads the packed update
# batch from HBM; the sink writes the decision batch back. Both buffers are tiny
# (a few hundred × 32/40 B), so any pseudo-channel is fine; kept on separate
# banks so the in/out bursts never contend.
sp=upd_inject.updates:HBM[0]
sp=decision_sink.decisions:HBM[1]


# ── FIFO depths ──────────────────────────────────────────────────────────────
# The :N suffix on each stream_connect sets the FIFO depth in beats (default is
# shallow, ~16-32). Two reasons it is set explicitly here:
#  1. The three app kernels have very different IIs (regime 1, risk 4, momentum
#     5), so one can run hundreds of ticks ahead of another. A shallow FIFO
#     fills, that kernel blocks, the blockage backs up through the broadcaster
#     into inctsvd_top, and the whole pipeline stalls.
#  2. Depth 512 comfortably exceeds a 299-tick batch, so no stage can be held
#     up by a downstream one within a single replay.
# The real deadlock fix is the read-ordering correction in risk_matrix (St
# before proj, matching momentum and inctsvd_top's write order); these depths
# are margin on top of it, not a substitute.

# ── ingress ──────────────────────────────────────────────────────────────────
stream_connect=upd_inject.upd_out:lob_filter.upd_in:2048
# LOB tick matrix into the SVD (decided ticks only)
stream_connect=lob_filter.Bt_out:inctsvd_top.Bt_in:256
# singular values -> all three apps
stream_connect=inctsvd_top.St_out:bcast_st.in:2048
stream_connect=bcast_st.out0:momentum_signal.St_in:2048
stream_connect=bcast_st.out1:risk_matrix.St_in:2048
stream_connect=bcast_st.out2:regime_classifier.St_in:2048
# projection magnitudes -> momentum + risk
stream_connect=inctsvd_top.proj_out:bcast_pm.in:2048
stream_connect=bcast_pm.out0:momentum_signal.proj_in:2048
stream_connect=bcast_pm.out1:risk_matrix.proj_in:2048
# NEW in B: the three app signals -> the on-chip vote
stream_connect=momentum_signal.res_out:decision_sink.mom_in:2048
stream_connect=risk_matrix.res_out:decision_sink.rsk_in:2048
stream_connect=regime_classifier.res_out:decision_sink.rgm_in:2048
# ── SLR placement ────────────────────────────────────────────────────────────
# FLIPPED from Option A. A used no HBM and put everything in SLR1 (next to the
# host/PCIe interface). B's feeder and sink now DMA to/from HBM, and on the U50
# all 32 HBM segments live in SLR0. Placing the whole chain in SLR0 keeps both
# the kernel-to-kernel AXI-Stream *and* the new HBM DMA path local; only the
# low-bandwidth AXI-Lite control crosses to the host interface, which is cheap.
# The design is ~150k LUT / ~1.2k DSP — a comfortable fit in SLR0
# (351,840 LUT / 2,352 DSP). If the link fails timing or routing, first try
# removing these slr= lines to let the placer decide, then try SLR1.
slr=upd_inject:SLR0
slr=lob_filter:SLR0
slr=inctsvd_top:SLR0
slr=bcast_st:SLR0
slr=bcast_pm:SLR0
slr=momentum_signal:SLR0
slr=risk_matrix:SLR0
slr=regime_classifier:SLR0
slr=decision_sink:SLR0

[clock]
freqHz=166666666:upd_inject.ap_clk
freqHz=166666666:lob_filter.ap_clk
freqHz=166666666:inctsvd_top.ap_clk
freqHz=166666666:bcast_st.ap_clk
freqHz=166666666:bcast_pm.ap_clk
freqHz=166666666:momentum_signal.ap_clk
freqHz=166666666:risk_matrix.ap_clk
freqHz=166666666:regime_classifier.ap_clk
freqHz=166666666:decision_sink.ap_clk
# 166.666 MHz on the shared default clock. If the hw link fails timing, drop to
# 125000000 and relink — even at the slowest kernel's II that is ~1.2 M
# decisions/s, far beyond any feed rate.
# freqHz=166666666:inctsvd_top.ap_clk

[vivado]
prop=run.impl_1.strategy=Performance_ExplorePostRoutePhysOpt
